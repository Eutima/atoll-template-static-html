server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Atoll "Generic" profile health check — see .claude/skills/atoll-compatible-skill/
    location = /metrics {
        default_type "text/plain; version=0.0.4";
        return 200 "# HELP up Whether the app is up\n# TYPE up gauge\nup 1\n";
    }

    # Rendered fresh per container start (see nginx/docker-entrypoint.d/) —
    # never browser-cache it stale across deploys.
    location = /assets/env.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
