<div class="flex min-h-screen items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-8 text-center shadow-sm">
    <h1 class="text-lg font-semibold text-gray-900">{{ 'auth.accessDenied.title' | transloco }}</h1>
    <p class="mt-2 text-sm text-gray-500">{{ 'auth.accessDenied.message' | transloco }}</p>
    <button
      type="button"
      (click)="signOut()"
      class="mt-6 w-full rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
    >
      {{ 'auth.accessDenied.signOut' | transloco }}
    </button>
  </div>
</div>
